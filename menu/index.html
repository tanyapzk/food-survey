<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Меню: варианты блюд</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F9;--lime:#E9FF79;--pink:#FFC6C6;--berry:#B71A3F;--berry-d:#8A102B;--ink:#221C1E;--mute:#6E6164;--soft:#FFF3F4;
--lime-t:color-mix(in srgb,var(--lime) 40%,white);--pink-t:color-mix(in srgb,var(--pink) 35%,white);--line:color-mix(in srgb,var(--ink) 10%,white)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.4;padding-bottom:90px}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.hero{padding:34px 0 14px}
.hero h1{font-size:clamp(28px,6vw,42px);margin:0 0 8px;letter-spacing:-.02em;font-weight:800}
.hero p{margin:0;color:var(--mute);max-width:640px}
.tabs{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .in{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:1080px;margin:0 auto;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--berry);border-color:var(--berry);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 4px}
.filters .chip{font-size:13px;padding:5px 12px}
.filters .chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:12px 0}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card .ph{aspect-ratio:4/3;overflow:hidden;background:var(--soft);cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.card .bd{padding:10px 12px 6px;cursor:pointer;flex:1}
.card h3{margin:0 0 6px;font-size:15px;line-height:1.25;font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mute)}
.card .act{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 10px 12px}
.act button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.act svg{width:15px;height:15px}
.card[data-s="1"]{border-color:#c9e04f;box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 45%,transparent)}
.card[data-s="1"] .add{background:var(--lime);border-color:var(--lime)}
.card[data-s="2"] img{filter:grayscale(1);opacity:.4}
.card[data-s="2"] h3{color:var(--mute);text-decoration:line-through}
.card[data-s="2"] .no{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
.bar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .t{font-size:14px;color:var(--mute)}
.bar .t b{color:var(--ink)}
.sync{font-size:12px;color:var(--mute)}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px;background:var(--berry);color:#fff}
.btn.o{background:#fff;color:var(--berry);border:1.5px solid var(--berry)}
.btn.l{background:var(--lime);color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(34,28,30,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:0 0 20px}
.sheet img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.sheet .c{padding:16px 18px}
.sheet h2{margin:0 0 8px;font-size:22px;font-weight:800}
.sheet h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.sheet ul,.sheet ol{margin:0;padding-left:20px}
.sheet li{margin:3px 0}
.sheet .note{background:var(--lime-t);border-radius:12px;padding:8px 12px;margin-top:12px;font-size:14px}
.sheet .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.full{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;display:none}
.full.on{display:block}
.mgroup{margin:20px 0}
.mgroup h3{margin:0 0 8px;font-size:20px;font-weight:800}
.mrow{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px;margin:6px 0}
.mrow img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.mrow b{flex:1;font-size:14px}
.shop{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.shop h5{margin:10px 0 4px;font-size:14px}
.shop ul{margin:0;padding-left:18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card h3{font-size:14px}.btn{padding:11px 14px;font-size:14px}}
</style>
</head>
<body>
<div class="wrap"><header class="hero"><h1>Что будем есть</h1>
<p>53 варианта: завтраки, обед и ужин, поздний вечер и соусы. Всё из того, что Рома любит или может есть. Нажми на блюдо, чтобы увидеть рецепт. «В меню» — берём, крестик — не наш вариант. Внизу собирается список покупок.</p></header></div>
<div class="tabs"><div class="in" id="tabs"></div></div>
<main class="wrap"><div class="filters" id="filters"></div><div class="grid" id="grid"></div></main>
<div class="bar"><div class="in"><div><div class="t">В меню: <b id="cnt">0</b></div><div class="sync" id="sync"></div></div><button class="btn" id="openmenu">Моё меню и покупки</button></div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="full" id="full"><div class="wrap">
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><button class="btn o" id="closemenu">Назад к блюдам</button><button class="btn l" id="copymenu">Скопировать меню и покупки</button></div>
<h1 style="margin:6px 0 0;font-size:30px;font-weight:800">Моё меню</h1><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>

Ветчина или лосось — 100 г", "Греческий йогурт — 3 ст. ложки", "Горчица, лимонный сок"], "st": ["Яйца-пашот: в слабо кипящую воду с ложкой уксуса, 3 минуты.", "Соус: йогурт, горчица и лимон перемешать.", "Собрать: тост, ветчина или лосось, яйцо, соус."], "note": "Праздничный вариант, раз в неделю."}, {"id": "b7", "m": "b", "n": "Сырники из духовки", "t": 25, "how": "Духовка", "img": "syrniki", "ing": ["Творог 5% — 400 г", "Яйцо — 1 шт", "Мука (можно овсяная) — 3 ст. ложки", "Ванилин, щепотка соли", "Ягоды и сметана для подачи"], "st": ["Всё перемешать, сформовать 8 сырников.", "На пергамент, 200°C, 20 минут (на середине перевернуть).", "Подавать с ягодами и сметаной."]}, {"id": "b8", "m": "b", "n": "Греческий йогурт с ягодами, орехами и гранолой", "t": 3, "how": "Без готовки", "img": "yogurtbowl", "ing": ["Греческий йогурт — 300 г", "Ягоды (малина, клубника, черника) — горсть", "Гранола — 4 ст. ложки", "Фисташки или тыквенные семечки — горсть"], "st": ["Всё выложить слоями в миску."]}, {"id": "b9", "m": "b", "n": "Смузи: банан, киви и йогурт", "t": 5, "how": "Без готовки", "img": "smoothie", "ing": ["Банан — 1 шт", "Киви — 2 шт", "Греческий йогурт — 150 г", "Ореховая паста — 1 ст. ложка", "Лёд, вода"], "st": ["Всё взбить блендером до однородности."], "note": "Ореховая паста добавляет жиров."}, {"id": "b10", "m": "b", "n": "Яйца вкрутую с овощами и соусом", "t": 12, "how": "Плита", "img": "boiledegg", "ing": ["Яйца — 4 шт", "Морковь, огурец, перец — по 1 шт", "Соус: сметана + горчица"], "st": ["Яйца варить 9 минут, остудить.", "Овощи нарезать палочками, подавать с соусом."]}, {"id": "b11", "m": "b", "n": "Шакшука с яйцами", "t": 20, "how": "Сковорода", "img": "shakshuka", "ing": ["Яйца — 4 шт", "Помидоры — 4 шт (или банка очищенных)", "Болгарский перец — 1 шт", "Лук — ½ шт, чеснок — 2 зубчика", "Паприка, соль"], "st": ["Лук, перец и чеснок тушить 5 минут, добавить помидоры и паприку, 8 минут.", "Сделать лунки, разбить яйца, накрыть на 5 минут.", "Подавать с лепёшкой function setSel(id,v){if(S.sel[id]===v)delete S.sel[id];else S.sel[id]=v;save();render();}
function openDish(d){const s=$('sheet');s.innerHTML=`<img src="../img/${d.img}.jpg" alt=""><div class="c"><h2>${d.n}</h2><div class="meta"><span class="tag">${MEAL[d.m]}</span><span class="tag">${d.t} мин</span><span class="tag">${d.how}</span></div>
 <h4>Что нужно (на двоих)</h4><ul>${d.ing.map(x=>'<li>'+x+'</li>').join('')}</ul><h4>Как готовить</h4><ol>${d.st.map(x=>'<li>'+x+'</li>').join('')}</ol>${d.note?'<div class="note">'+d.note+'</div>':''}
 <div class="row"><button class="btn" id="sa">${S.sel[d.id]===1?'Убрать из меню':'Взять в меню'}</button><button class="btn o" id="sc">Закрыть</button></div></div>`;
 $('ov').classList.add('on');$('sc').onclick=()=>$('ov').classList.remove('on');$('sa').onclick=()=>{setSel(d.id,1);$('ov').classList.remove('on');};}
$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('on');};
function chosen(){return DISHES.filter(d=>S.sel[d.id]===1);}
function showMenu(){const b=$('mbody');b.innerHTML='';const ch=chosen();if(!ch.length){b.innerHTML='<p style="color:var(--mute)">Пока ничего не выбрано.</p>';}
 Object.entries(MEAL).forEach(([k,v])=>{const l=ch.filter(d=>d.m===k);if(!l.length)return;const g=document.createElement('div');g.className='mgroup';g.innerHTML='<h3>'+v+'</h3>'+l.map(d=>`<div class="mrow"><img src="../img/${d.img}.jpg" alt=""><b>${d.n}</b></div>`).join('');b.appendChild(g);});
 if(ch.length){const s=document.createElement('div');s.className='shop';s.innerHTML='<h3 style="margin:0;font-weight:800;font-size:18px">Список покупок</h3>'+ch.map(d=>'<h5>'+d.n+'</h5><ul>'+d.ing.map(x=>'<li>'+x+'</li>').join('')+'</ul>').join('');b.appendChild(s);}
 $('full').classList.add('on');$('full').scrollTop=0;}
$('openmenu').onclick=showMenu;$('closemenu').onclick=()=>$('full').classList.remove('on');
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
$('copymenu').onclick=async()=>{const ch=chosen();let t='Меню\n';Object.entries(MEAL).forEach(([k,v])=>{const l=ch.filter(d=>d.m===k);if(l.length)t+='\n'+v.toUpperCase()+'\n'+l.map(d=>'• '+d.n).join('\n')+'\n';});
 t+='\nСПИСОК ПОКУПОК\n'+ch.map(d=>d.n+':\n'+d.ing.map(x=>'  - '+x).join('\n')).join('\n');
 try{await navigator.clipboard.writeText(t);toast('Скопировано');}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Скопировано');}catch(_){toast('Не получилось скопировать');}a.remove();}};
// сохранение
let cloud=null,cloudOK=false,timer=null;
function sm(t){$('sync').textContent=t;}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}sm('Сохраняю…');clearTimeout(timer);timer=setTimeout(cw,700);}
async function cw(){if(!cloudOK){sm('Сохранено на этом устройстве');return;}try{await cloud.fns.setDoc(cloud.ref,{kind:'food-menu',sel:S.sel,updatedAt:cloud.fns.serverTimestamp()});sm('Сохранено');}catch(e){sm('Сохранено на этом устройстве');}}
async function initCloud(){try{const app=await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');const fs=await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
 const a=app.initializeApp({apiKey:"AIzaSyDoBRB7z4Kywfv3uZi9h0CGGQObvKbtHbo",authDomain:"vocabulary-app-50c24.firebaseapp.com",projectId:"vocabulary-app-50c24",storageBucket:"vocabulary-app-50c24.firebasestorage.app",messagingSenderId:"802755830502",appId:"1:802755830502:web:d60bf64a2999861c2a5127"});
 cloud={fns:fs,ref:fs.doc(fs.getFirestore(a),'students','food_menu_'+uid)};const snap=await fs.getDoc(cloud.ref);
 if(snap.exists()){const d=snap.data();const cn=(d.updatedAt&&d.updatedAt.toMillis?d.updatedAt.toMillis():0)>(S.updatedAt||0);if(cn||!Object.keys(S.sel).length){S.sel=d.sel||{};render();}}
 cloudOK=true;sm('Сохранено');if(Object.keys(S.sel).length)cw();}catch(e){sm('Только на этом устройстве');}}
render();initCloud();
</script>
</body>
</html>
